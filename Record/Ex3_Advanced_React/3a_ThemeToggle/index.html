<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggle - React Context</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }

        body.light {
            background: #f5f5f5;
            color: #333;
        }
        body.dark {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            border-bottom: 1px solid #ddd;
        }
        body.dark .navbar { border-bottom-color: #333; }

        .navbar h2 { font-size: 20px; }

        .toggle-btn {
            padding: 8px 20px;
            border: 2px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            color: inherit;
        }
        body.light .toggle-btn { border-color: #333; }
        body.dark .toggle-btn { border-color: #e94560; color: #e94560; }
        .toggle-btn:hover { opacity: 0.8; }

        .content {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        body.light .card { background: #fff; border-color: #ddd; }
        body.dark .card { background: #16213e; border-color: #333; }

        .card h3 { margin-bottom: 10px; font-size: 18px; }
        body.dark .card h3 { color: #e94560; }

        .card p { line-height: 1.6; font-size: 14px; color: #666; }
        body.dark .card p { color: #aaa; }

        .theme-indicator {
            text-align: center;
            font-size: 48px;
            margin: 20px 0;
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }
        body.light .status { background: #e8f5e9; color: #2e7d32; }
        body.dark .status { background: #1b1b3a; color: #e94560; }
    </style>
</head>
<body class="light">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useContext, createContext } = React;

        // Create Theme Context
        const ThemeContext = createContext();

        function ThemeProvider({ children }) {
            const [theme, setTheme] = useState('light');

            const toggleTheme = () => {
                const newTheme = theme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
                document.body.className = newTheme;
            };

            return (
                <ThemeContext.Provider value={{ theme, toggleTheme }}>
                    {children}
                </ThemeContext.Provider>
            );
        }

        function Navbar() {
            const { theme, toggleTheme } = useContext(ThemeContext);
            return (
                <nav className="navbar">
                    <h2>🎨 Theme Toggle App</h2>
                    <button className="toggle-btn" onClick={toggleTheme}>
                        {theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode'}
                    </button>
                </nav>
            );
        }

        function Content() {
            const { theme } = useContext(ThemeContext);
            return (
                <div className="content">
                    <div className="theme-indicator">
                        {theme === 'light' ? '☀️' : '🌙'}
                    </div>
                    <div className="status">
                        Current Theme: {theme.toUpperCase()} MODE
                    </div>
                    <div className="card" style={{ marginTop: '20px' }}>
                        <h3>About This App</h3>
                        <p>
                            This application demonstrates React Context API for global state management.
                            The theme state is managed in a ThemeProvider and consumed by child components
                            using the useContext hook, avoiding prop drilling.
                        </p>
                    </div>
                    <div className="card">
                        <h3>How It Works</h3>
                        <p>
                            1. A ThemeContext is created using React.createContext().<br />
                            2. ThemeProvider wraps the app and provides theme state via Context.Provider.<br />
                            3. Child components (Navbar, Content) consume the context using useContext().<br />
                            4. Clicking the toggle button updates the global theme state instantly.
                        </p>
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <ThemeProvider>
                    <Navbar />
                    <Content />
                </ThemeProvider>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
