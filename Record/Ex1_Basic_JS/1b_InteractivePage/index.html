<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HTML, CSS &amp; JS Interactive Page</h1>
    </header>
    <main>
        <input type="text" id="userInput" placeholder="Type something..." />
        <button id="displayBtn">Click Me!</button>
        <div id="output">Hello, World!</div>

        <section class="color-section">
            <h3>Change Background Color</h3>
            <button class="color-btn" data-color="#e74c3c" style="background:#e74c3c;">Red</button>
            <button class="color-btn" data-color="#2ecc71" style="background:#2ecc71;">Green</button>
            <button class="color-btn" data-color="#3498db" style="background:#3498db;">Blue</button>
            <button class="color-btn" data-color="#f5f5f5" style="background:#ccc;color:#333;">Reset</button>
        </section>

        <section class="counter-section">
            <h3>Simple Counter</h3>
            <button id="decrementBtn">−</button>
            <span id="counterValue">0</span>
            <button id="incrementBtn">+</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
